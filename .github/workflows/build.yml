name: Build APK

on:
  workflow_dispatch:        # 手动触发（网页点按钮）
  push:
    tags:
      - 'v*'

jobs:
  build:
    # 用 Ubuntu 22.04：libtool 2.4.6 保留 LT_SYS_SYMBOL_USCORE 宏，
    # 24.04 的 libtool 2.4.7 移除了它，导致 libffi autoreconf 失败
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 安装 buildozer 和依赖
        run: |
          pip install --upgrade buildozer cython
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev libffi-dev cmake libssl-dev

      - name: 设置 swap（防 numpy 编译内存不足）
        run: |
          sudo fallocate -l 4G /swapfile || true
          sudo chmod 600 /swapfile || true
          sudo mkswap /swapfile || true
          sudo swapon /swapfile || true
          sudo swapon --show

      - name: 打包 APK
        env:
          ANDROID_ACCEPT_SDK_LICENSE: "yes"
        run: buildozer android debug

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: tfm-apk
          path: bin/*.apk
          retention-days: 30
